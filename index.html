<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Sets data-theme on <html> before first paint, mirroring
      // src/utils/themePreference.ts's rule (a stored choice always wins;
      // otherwise fall back to the OS preference). App.tsx only applies that
      // attribute in an effect AFTER the first successful render, which
      // leaves two gaps this closes: every cold start briefly paints the
      // light palette before React mounts, and a crash during that very
      // first render (ErrorBoundary.tsx, which also reads data-theme) shows
      // the light palette regardless of what was actually stored or
      // preferred. Deliberately separate from the stale-bundle recovery
      // script below (src/indexHtmlRecovery.test.ts) — unrelated concerns,
      // and this one has to run first, before anything paints. Plain ES5,
      // same as that script, for the same reason: no build step touches it.
      (function () {
        try {
          var STORAGE_KEY = 'tutto-theme';
          var stored = null;
          try {
            stored = localStorage.getItem(STORAGE_KEY);
          } catch (storageReadError) {
            stored = null;
          }

          var theme;
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else {
            var prefersDark = false;
            try {
              prefersDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            } catch (matchMediaError) {
              prefersDark = false;
            }
            theme = prefersDark ? 'dark' : 'light';
          }

          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          // Never block the page load over a theme guess.
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <!-- Matches src/index.css's `color-scheme` (light on :root, dark under
         [data-theme="dark"]) for the one frame before that stylesheet
         parses — without it the very first paint is forced light regardless
         of the OS or the stored theme, which briefly flashes white on a dark
         start. -->
    <meta name="color-scheme" content="light dark" />
    <!-- Colours the browser chrome (address bar / status bar) for a plain
         tab, distinct from the PWA manifest's own theme_color (vite.config.ts),
         which only paints the installed app's splash screen/task switcher —
         kept in sync with it by src/pwaManifestColors.test.ts. -->
    <meta name="theme-color" content="#4f39f6" />
    <!-- viewport-fit=cover: lets the page draw under the notch/home-indicator
         on a phone with a cutout instead of leaving those areas at the OS's
         default background colour, so the env(safe-area-inset-*) padding
         App.tsx's HUD wrapper uses (see the comment there) has a cutout to
         actually pad around — without this the browser never reports a
         non-zero safe-area inset at all. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tutto</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Recovers from a stale service-worker cache serving an old HTML shell
      // that references JS chunks the current deploy no longer has (a failed
      // dynamic import, or a <script> tag itself 404ing/erroring). Runs before
      // main.tsx (and any React error boundary) even executes, so it can't
      // rely on any app code being loaded yet.
      //
      // Throttled to at most once per RELOAD_COOLDOWN_MS so a persistently
      // broken deploy triggers one reload attempt, not a refresh loop.
      var RELOAD_COOLDOWN_MS = 60000;
      // isExcluded guards against ever auto-reloading for an unrelated
      // third-party <script> error (analytics, a CDN widget, etc.) that
      // happens to load from '/assets/' or '/src/' in its own URL. The app
      // currently loads no such scripts — every external resource it uses
      // (Google Fonts) comes in via a CSS @import, which this listener never
      // sees — so this list is inert today; kept as a guard for if one is
      // ever added.
      var EXCLUDED_SCRIPT_SRC_SUBSTRINGS = ['socket.io', 'google', 'fonts.googleapis', 'cdn', 'analytics'];

      window.addEventListener('error', function(e) {
        var isChunkError = e.message && (e.message.includes('Failed to fetch dynamically imported module') || e.message.includes('Importing a module script failed'));
        var isAppScript = e.target && e.target.src && (e.target.src.includes('/assets/') || e.target.src.includes('/src/'));
        var isExcluded = e.target && e.target.src && EXCLUDED_SCRIPT_SRC_SUBSTRINGS.some(function(s) { return e.target.src.includes(s); });
        var isScriptError = e.target && e.target.tagName === 'SCRIPT' && isAppScript && !isExcluded;

        if (isChunkError || isScriptError) {
          // Offline is the one case where recovering is strictly worse than
          // doing nothing: the recovery below deletes every cache and
          // unregisters the worker, and with no network there is nothing to
          // refill them from — a missing chunk becomes an app that cannot
          // start at all until the device is back online. The throttle is no
          // help here, because one pass is all the damage there is. Returning
          // before the timestamp is written also leaves the single allowed
          // attempt intact for when the connection is back.
          if (navigator.onLine === false) {
            console.warn('[Auto-reload skipped] Offline — keeping the precache and the worker');
            return;
          }

          // Raw localStorage calls throw in a blocked/private context (Safari
          // ITP, a locked-down embed, dom.storage.enabled=false) — letting
          // either propagate would abort this listener before it ever reaches
          // the cache/unregister/reload chain below, silently disabling the
          // one path meant to recover a broken deploy. Read failure falls back
          // to "no previous reload"; write failure just means the NEXT error
          // cannot be throttled against this one, not that THIS recovery must
          // not happen.
          var lastReloadRaw = null;
          try {
            lastReloadRaw = localStorage.getItem('tutto_last_reload');
          } catch (storageReadError) {
            lastReloadRaw = null;
          }
          var now = Date.now();
          // A hand-edited or corrupted value parses to NaN, and NaN compares
          // false against everything — the unguarded version below fell into
          // "too soon" forever rather than ever recovering again. Number
          // .isFinite is the guard that makes a garbage value count as "no
          // previous reload" instead.
          var lastReloadTime = lastReloadRaw === null ? NaN : parseInt(lastReloadRaw, 10);
          var hasLastReload = Number.isFinite(lastReloadTime);

          console.warn('[Auto-reload Check]', {
            message: e.message,
            src: e.target && e.target.src,
            isChunkError: isChunkError,
            isScriptError: isScriptError,
            lastReload: hasLastReload ? new Date(lastReloadTime).toISOString() : null,
            timeSinceLastReload: hasLastReload ? (now - lastReloadTime) + 'ms' : 'never'
          });

          if (!hasLastReload || (now - lastReloadTime) > RELOAD_COOLDOWN_MS) {
            console.error('[Auto-reloading] Triggering reload due to:', e.message || (e.target && e.target.src));
            try {
              localStorage.setItem('tutto_last_reload', now.toString());
            } catch (storageWriteError) {
              // Best-effort throttle bookkeeping — see the comment above.
            }
            // Unregistering matters as much as deleting, and this was the one
            // recovery path that skipped it. src/sw.js only fills the precache
            // from its `install` event, and an unchanged worker never installs
            // again — so wiping the caches under a still-registered worker
            // destroys offline support until some later deploy happens to
            // change an asset. Unregistering makes the reload register a fresh
            // worker, which installs and precaches. Same pairing Home.tsx and
            // ErrorBoundary.tsx already use for their own recovery buttons.
            var unregisterThenReload = function() {
              if (!('serviceWorker' in navigator)) {
                window.location.reload();
                return;
              }
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                return Promise.all(registrations.map(function(r) { return r.unregister(); }));
              })['catch'](function() {})
                .then(function() { window.location.reload(); });
            };
            if ('caches' in window) {
              caches.keys().then(function(names) {
                return Promise.all(names.map(function(name) { return caches.delete(name); }));
              })['catch'](function() {})
                .then(unregisterThenReload);
            } else {
              unregisterThenReload();
            }
          } else {
            console.log('[Auto-reload skipped] Too soon since last reload');
          }
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
